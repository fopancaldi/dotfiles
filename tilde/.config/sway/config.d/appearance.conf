default_border pixel 3

font Agave Nerd Font 12

seat * xcursor_theme Bibata-Original-Classic
seat * hide_cursor 10000

bar {
    swaybar_command waybar
}

for_window [app_id="eu.betterbird.Betterbird" title="^Write: "] floating enable
for_window [app_id="flameshot"] floating enable
for_window [app_id="qalculate"] floating enable
for_window [app_id="gnuplot_qt"] floating enable
for_window [app_id="matplotlib"] floating enable
for_window [app_id="mpv"] floating enable
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="org.pulseaudio.pavucontrol"] floating enable
#for_window [app_id="swayimg"] floating enable
#for_window [app_id="swayimg"] floating enable, border pixel 3
for_window [instance="fontpreview"] floating enable
for_window [instance="pinentry-gtk"] floating enable
for_window [window_role="pop-up"] floating enable
for_window [window_role="About"] floating enable
