[[language]]
name = "bash"
indent = { tab-width = 2, unit = " " }
auto-format = true
formatter = { command = "beautysh", args = [ "-" ] }

[[language]]
name = "cpp"
roots = [ "CMakeLists.txt" ]
indent = { tab-width = 4, unit = " " }
auto-format = true
formatter = { command = "clang-format" }

[language-server.clangd]
config = { fallbackFlags = "-std=c++20" }
